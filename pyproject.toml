[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leaffliction"
version = "0.1.0"
description = "Leaffliction — leaf image classification (42 computer vision module)"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
]

[project.scripts]
dist = "Distribution:main"
aug = "Augmentation:main"
xfm = "Transformation:main"
tr = "train:main"
pr = "predict:main"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "Distribution",
    "Augmentation",
    "Transformation",
    "train",
    "predict",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["distribution*"]

[tool.uv]
link-mode = "copy"
