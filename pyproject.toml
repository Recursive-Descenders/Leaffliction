[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leaffliction"
version = "0.1.0"
description = "Leaffliction — leaf image classification (42 computer vision module)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python",
    "plantcv",
    "tqdm>=4.67.0",
]

[project.scripts]
dist = "Distribution:main"
aug = "Augmentation:main"
aug-dataset = "AugDataset:main"
split = "Split:main"
xfm = "Transformation:main"
tr = "train:main"
pr = "predict:main"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "opencv-stubs>=0.1.3",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "Distribution",
    "Augmentation",
    "AugDataset",
    "Split",
    "Transformation",
    "train",
    "predict",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["distribution*"]

[tool.uv]
link-mode = "copy"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
